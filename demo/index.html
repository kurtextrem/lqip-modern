<html>
  <head>
    <meta charset="UTF-8" />
    <title>LQIP comparison demo</title>
    <link rel="stylesheet" href="./assets/cssLQIP.css" />
    <style type="text/css">
      body {
        font-family: sans-serif;
        background: #000;
        color: #fff;
        padding: 2rem;
      }

      html {
        scroll-behavior: smooth;
        scroll-snap-type: y mandatory;
        scroll-padding-top: 1rem;
      }

      a {
        color: tomato;
      }

      a:visited {
        color: firebrick;
      }

      h1 {
        display: flex;
        align-items: center;
        gap: 1rem;
        scroll-snap-align: start;
        scroll-snap-stop: always;
      }

      table {
        border-collapse: collapse;
        border-spacing: 0;
        table-layout: fixed;
        width: 100%;
      }

      td,
      th {
        width: 240px;
        vertical-align: top;
      }

      th {
        text-align: left;
        padding: 0.75rem;
      }

      td {
        padding: 0.5rem 0;
      }

      .preview-wrapper {
        position: relative;
        height: 0;
        overflow: hidden;
      }

      .preview-wrapper.is-loading .preview,
      .preview-wrapper.is-loading .css-preview,
      .preview-wrapper.is-loading .css-lqip-preview {
        opacity: 0.38;
      }

      .preview,
      .css-preview {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }

      .preview {
        display: block;
        object-fit: cover;
      }

      .preview-anchor {
        position: absolute;
        inset: 0;
        display: block;
        cursor: pointer;
      }

      .preview-anchor:focus-visible {
        outline: 2px solid #ffe27a;
        outline-offset: 2px;
      }

      .css-preview {
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
      }

      .preview-wrapper-lqip::after {
        content: "";
        position: absolute;
        inset: 0;
        backdrop-filter: blur(var(--css-blur, 20px));
        pointer-events: none;
      }

      .blur-overlay {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        transform: scale(1);
      }

      .size-below {
        margin-top: 0.45rem;
        font-size: 0.78rem;
        color: #ddd;
      }

      .size-below.is-winner {
        color: #ffe27a;
      }

      [hidden] {
        display: none !important;
      }

      .loading,
      .error {
        margin-top: 1rem;
      }

      .controls {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 0.8rem 1rem;
        margin: 1.2rem 0;
        padding: 1rem;
        border: 1px solid #222;
        background: #111;
        scroll-snap-align: start;
        scroll-snap-stop: always;
      }

      .controls label,
      .controls .group {
        display: grid;
        gap: 0.35rem;
        font-size: 0.85rem;
      }

      .controls select,
      .controls input[type="range"] {
        width: 100%;
        background: #1b1b1b;
        color: #fff;
        border: 1px solid #333;
        border-radius: 4px;
      }

      .controls input[type="checkbox"] {
        margin-right: 0.35rem;
      }

      .controls .helper {
        color: #aaa;
        font-size: 0.75rem;
      }

      .controls .wide {
        grid-column: 1 / -1;
      }

      .checkbox-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 0.35rem 0.7rem;
      }

      .checkbox-grid label {
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
      }

      #rows > tr {
        scroll-snap-align: start;
        scroll-snap-stop: always;
        scroll-margin-top: 1rem;
      }
    </style>
  </head>
  <body>
    <h1>
      LQIP Comparison Demo
      <a href="https://github.com/transitive-bullshit/lqip-modern">
        <img src="./assets/github.svg" width="32" alt="GitHub" />
      </a>
    </h1>

    <p>
      LQIP (Low Quality Image Placeholders) generates efficient placeholder
      previews for image-heavy pages to improve perceived loading.
    </p>

    <div id="status" class="loading">Loading comparison data...</div>

    <div id="controls" class="controls" hidden>
      <label>
        WebP quality <span id="webp-quality-value">50</span>
        <input id="webp-quality" type="range" min="0" max="7" step="1" value="1" />
      </label>

      <label>
        AVIF quality <span id="avif-quality-value">70</span>
        <input id="avif-quality" type="range" min="0" max="7" step="1" value="2" />
      </label>

      <label>
        Blur mode
        <select id="blur-mode">
          <option value="backdrop" selected>Backdrop-filter blur</option>
          <option value="filter">Filter blur</option>
          <option value="svg-filter-css">SVG filter (CSS)</option>
          <option value="svg-filter">SVG blur (default)</option>
          <option value="nextjs-blur">SVG blur (nextjs blur)</option>
          <option value="sharp">Sharp blur in image bytes</option>
        </select>
      </label>

      <label class="sharp-only">
        Sharp blur level
        <select id="sharp-blur-level"></select>
      </label>

      <label class="sharp-only">
        Sharp blur target
        <select id="sharp-blur-target">
          <option value="placeholder">Apply blur on placeholder</option>
          <option value="original">Apply blur on original image</option>
        </select>
      </label>

      <label>
        Blur amount <span id="css-blur-value">20px</span>
        <input id="css-blur" type="range" min="0" max="40" step="1" value="20" />
        <span class="helper">Seamless live update from 0px to 40px.</span>
      </label>

      <div class="group wide quality-options">
        <strong>Quality options</strong>
        <span class="helper"
          >Used for all client blur modes, or sharp mode when blur level is none.</span
        >
        <div class="checkbox-grid">
          <label><input id="avif-lossless" type="checkbox" /> AVIF lossless</label>
          <label
            ><input id="avif-chroma-444" type="checkbox" checked /> AVIF chroma
            4:4:4 (untick to use 4:2:0)</label
          >
          <label
            >AVIF bitdepth
            <select id="avif-bitdepth">
              <option value="8">8-bit</option>
              <option value="10">10-bit</option>
              <option value="12">12-bit</option>
            </select></label
          >
          <label
            ><input id="webp-smart-subsample" type="checkbox" checked /> WebP
            smartSubsample</label
          >
          <label
            ><input id="webp-smart-deblock" type="checkbox" /> WebP
            smartDeblock</label
          >
          <label
            >WebP alpha quality <span id="webp-alpha-quality-value">100</span>
            <input
              id="webp-alpha-quality"
              type="range"
              min="0"
              max="100"
              step="1"
              value="100"
            />
          </label
          >
          <label><input id="webp-lossless" type="checkbox" /> WebP lossless</label>
          <label
            ><input id="webp-near-lossless" type="checkbox" /> WebP near
            lossless</label
          >
        </div>
      </div>

      <div class="group wide">
        <strong>Visible options</strong>
        <div id="variant-visibility" class="checkbox-grid"></div>
      </div>
    </div>

    <table id="comparison-table" hidden>
      <thead>
        <tr id="header-row"></tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>

    <svg width="0" height="0" style="position: absolute; visibility: hidden">
      <filter id="svgBlur" color-interpolation-filters="sRGB">
        <feGaussianBlur stdDeviation="20"></feGaussianBlur>
        <feComponentTransfer>
          <feFuncA type="discrete" tableValues="1 1"></feFuncA>
        </feComponentTransfer>
      </filter>
    </svg>

    <script type="module">
      import { getImageBlurSvg } from "/2026/svgFilter.js"
      import { svgBlurImage } from "/2026/svgFilter2.js"

      const MODERN_VARIANTS = [
        { id: "modern-webp-8", label: "webp @ 8px (next.js)", format: "webp", size: 8 },
        { id: "modern-avif-8", label: "avif @ 8px", format: "avif", size: 8 },
        {
          id: "modern-webp-16",
          label: "webp @ 16px",
          format: "webp",
          size: 16,
          selected: true
        },
        { id: "modern-avif-16", label: "avif @ 16px", format: "avif", size: 16 },
        { id: "modern-webp-32", label: "webp @ 32px", format: "webp", size: 32 },
        { id: "modern-avif-32", label: "avif @ 32px", format: "avif", size: 32 }
      ]

      const STATIC_VARIANTS = [
        {
          id: "thumbnail",
          label: "Thumbnail",
          type: "thumbnail",
          defaultVisible: true
        },
        {
          id: "gip",
          label: "gip (cssgip)",
          type: "css",
          defaultVisible: false
        },
        {
          id: "css-lqip",
          label: "CSS-LQIP",
          type: "css-lqip",
          defaultVisible: true
        },
        {
          id: "blurhash-as-css-gradient",
          label: "blurhash-as-css-gradient",
          type: "css",
          defaultVisible: false
        },
        {
          id: "blurhash-as-css",
          label: "blurhash-as-css",
          type: "css",
          defaultVisible: false
        }
      ]

      const VARIANTS = [...STATIC_VARIANTS.slice(0, 1), ...MODERN_VARIANTS, ...STATIC_VARIANTS.slice(1)]

      const modernPreviewCache = new Map()
      const imageDataUrlCache = new Map()
      const qualityOptions = []
      const variantIds = new Set(VARIANTS.map((variant) => variant.id))
      const BLUR_MODES = new Set([
        "backdrop",
        "filter",
        "svg-filter-css",
        "svg-filter",
        "nextjs-blur",
        "sharp"
      ])

      function formatBytes(bytes) {
        if (bytes < 1000) return `${bytes} B`
        if (bytes < 1000 * 1000) return `${(bytes / 1000).toFixed(2)} kB`
        return `${(bytes / (1000 * 1000)).toFixed(2)} MB`
      }

      function getBlurConfig(controlsConfig, blurLevelId) {
        return controlsConfig.blurLevels.find((level) => level.id === blurLevelId)
      }

      function getStaticResult(image, variantId) {
        if (variantId === "thumbnail") {
          return image.thumbnail
        }

        return image.results.find((result) => result.variantName === variantId)
      }

      function getVisibleVariants(state) {
        return VARIANTS.filter((variant) => state.visibleVariantIds.has(variant.id))
      }

      function qualityAt(index) {
        return qualityOptions[Math.max(0, Math.min(qualityOptions.length - 1, index))]
      }

      function qualityIndex(value) {
        const idx = qualityOptions.indexOf(value)
        return idx === -1 ? 0 : idx
      }

      function parseBooleanQuery(value, fallback) {
        if (value === null) return fallback
        const normalized = value.toLowerCase()
        return normalized === "1" || normalized === "true" || normalized === "yes"
      }

      function parseIntQuery(value, fallback, min, max) {
        if (value === null) return fallback
        const num = Number(value)
        if (!Number.isFinite(num)) return fallback
        return Math.min(max, Math.max(min, Math.round(num)))
      }

      function normalizeBlurMode(value) {
        if (value === "css") return "backdrop"
        return BLUR_MODES.has(value) ? value : "backdrop"
      }

      function syncQueryParams(state) {
        const params = new URLSearchParams(window.location.search)
        params.set("webpQuality", String(state.webpQuality))
        params.set("avifQuality", String(state.avifQuality))
        params.set("blurMode", state.blurMode)
        params.set("sharpBlurLevel", state.sharpBlurLevel)
        params.set("sharpBlurTarget", state.sharpBlurTarget)
        params.set("cssBlurPx", String(state.cssBlurPx))

        params.set("avifLossless", state.avifLossless ? "1" : "0")
        params.set("avifChromaSubsampling", state.avifChromaSubsampling444 ? "444" : "420")
        params.set("avifBitdepth", String(state.avifBitdepth))
        params.set("webpSmartSubsample", state.webpSmartSubsample ? "1" : "0")
        params.set("webpSmartDeblock", state.webpSmartDeblock ? "1" : "0")
        params.set("webpAlphaQuality", String(state.webpAlphaQuality))
        params.set("webpLossless", state.webpLossless ? "1" : "0")
        params.set("webpNearLossless", state.webpNearLossless ? "1" : "0")

        const orderedVisible = VARIANTS.filter((variant) =>
          state.visibleVariantIds.has(variant.id)
        ).map((variant) => variant.id)
        params.set("visible", orderedVisible.join(","))

        const query = params.toString()
        const nextUrl = query
          ? `${window.location.pathname}?${query}`
          : window.location.pathname
        window.history.replaceState({}, "", nextUrl)
      }

      function hydrateStateFromQuery(state, controlsConfig) {
        const params = new URLSearchParams(window.location.search)

        const webpQuality = Number(params.get("webpQuality"))
        if (qualityOptions.includes(webpQuality)) {
          state.webpQuality = webpQuality
        }

        const avifQuality = Number(params.get("avifQuality"))
        if (qualityOptions.includes(avifQuality)) {
          state.avifQuality = avifQuality
        }

        const blurMode = params.get("blurMode")
        if (blurMode) {
          state.blurMode = normalizeBlurMode(blurMode)
        }

        const sharpBlurLevel = params.get("sharpBlurLevel")
        if (
          sharpBlurLevel &&
          controlsConfig.blurLevels.some((level) => level.id === sharpBlurLevel)
        ) {
          state.sharpBlurLevel = sharpBlurLevel
        }

        const sharpBlurTarget = params.get("sharpBlurTarget")
        if (
          sharpBlurTarget &&
          controlsConfig.blurTargets.includes(sharpBlurTarget)
        ) {
          state.sharpBlurTarget = sharpBlurTarget
        }

        state.cssBlurPx = parseIntQuery(params.get("cssBlurPx"), state.cssBlurPx, 0, 40)
        state.avifLossless = parseBooleanQuery(
          params.get("avifLossless"),
          state.avifLossless
        )
        const avifChromaSubsampling = params.get("avifChromaSubsampling")
        if (avifChromaSubsampling === "444" || avifChromaSubsampling === "420") {
          state.avifChromaSubsampling444 = avifChromaSubsampling === "444"
        } else {
          state.avifChromaSubsampling444 = parseBooleanQuery(
            params.get("avifChromaSubsampling444"),
            state.avifChromaSubsampling444
          )
        }
        state.avifBitdepth = parseIntQuery(params.get("avifBitdepth"), state.avifBitdepth, 8, 12)
        if (![8, 10, 12].includes(state.avifBitdepth)) {
          state.avifBitdepth = 8
        }
        state.webpSmartSubsample = parseBooleanQuery(
          params.get("webpSmartSubsample"),
          state.webpSmartSubsample
        )
        state.webpSmartDeblock = parseBooleanQuery(
          params.get("webpSmartDeblock"),
          state.webpSmartDeblock
        )
        const webpAlphaQualityRaw = params.get("webpAlphaQuality")
        const hasLegacyChromaParam = params.has("avifChromaSubsampling444")
        if (hasLegacyChromaParam && (webpAlphaQualityRaw === "0" || webpAlphaQualityRaw === "1")) {
          // Legacy URLs stored this as a boolean toggle, both paths effectively used alphaQuality=100.
          state.webpAlphaQuality = 100
        } else {
          state.webpAlphaQuality = parseIntQuery(
            webpAlphaQualityRaw,
            state.webpAlphaQuality,
            0,
            100
          )
        }
        state.webpLossless = parseBooleanQuery(
          params.get("webpLossless"),
          state.webpLossless
        )
        state.webpNearLossless = parseBooleanQuery(
          params.get("webpNearLossless"),
          state.webpNearLossless
        )

        const visible = params.get("visible")
        if (visible !== null) {
          const nextVisible = new Set(
            visible
              .split(",")
              .map((id) => id.trim())
              .filter((id) => variantIds.has(id))
          )
          state.visibleVariantIds = nextVisible
        }
      }

      function modernUrl(image, variant, state) {
        const params = new URLSearchParams()
        params.set("image", image.filename)
        params.set("format", variant.format)
        params.set("size", String(variant.size))
        params.set(
          "quality",
          String(variant.format === "webp" ? state.webpQuality : state.avifQuality)
        )

        const blurMode = normalizeBlurMode(state.blurMode)
        const sharpBlurLevel = blurMode === "sharp" ? state.sharpBlurLevel : "0"
        params.set("sharpBlurLevel", sharpBlurLevel)
        params.set(
          "sharpBlurTarget",
          sharpBlurLevel === "0" ? "placeholder" : state.sharpBlurTarget
        )

        if (blurMode === "svg-filter-css" || blurMode === "svg-filter" || blurMode === "nextjs-blur") {
          params.set("clientBlurKey", String(state.cssBlurPx))
        }

        if (blurMode !== "sharp" || (blurMode === "sharp" && sharpBlurLevel === "0")) {
          params.set("avifLossless", String(state.avifLossless))
          params.set(
            "avifChromaSubsampling",
            state.avifChromaSubsampling444 ? "444" : "420"
          )
          params.set("avifBitdepth", String(state.avifBitdepth))
          params.set("webpSmartSubsample", String(state.webpSmartSubsample))
          params.set("webpSmartDeblock", String(state.webpSmartDeblock))
          params.set("webpAlphaQuality", String(state.webpAlphaQuality))
          params.set("webpLossless", String(state.webpLossless))
          params.set("webpNearLossless", String(state.webpNearLossless))
        }

        return `/api/modern?${params.toString()}`
      }

      async function loadModernPreview(url) {
        const cached = modernPreviewCache.get(url)
        if (cached) return cached

        const response = await fetch(url)
        if (!response.ok) {
          throw new Error(`Request failed (${response.status})`)
        }

        const blob = await response.blob()
        const objectUrl = URL.createObjectURL(blob)
        const strippedBytesHeader = response.headers.get("X-Avif-Stripped-Bytes")
        const strippedBytes = strippedBytesHeader === null ? null : Number(strippedBytesHeader)
        const value = {
          objectUrl,
          sizeBytes: blob.size,
          strippedBytes: Number.isFinite(strippedBytes) ? strippedBytes : null
        }
        modernPreviewCache.set(url, value)
        return value
      }

      function applyCssBlur(target, cssBlurPx) {
        if (cssBlurPx > 0) {
          target.style.filter = `blur(${cssBlurPx}px)`
          target.style.transform = `scale(${1 + cssBlurPx * 0.02})`
        } else {
          target.style.removeProperty("filter")
          target.style.removeProperty("transform")
        }
      }

      function cssUrl(url) {
        return `url("${url.replace(/"/g, '\\"')}")`
      }

      function blobToDataUrl(blob) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader()
          reader.onload = () => resolve(reader.result)
          reader.onerror = () => reject(reader.error || new Error("Failed to read image blob"))
          reader.readAsDataURL(blob)
        })
      }

      async function getImageDataUrl(sourceUrl) {
        if (!sourceUrl) return null
        if (sourceUrl.startsWith("data:")) return sourceUrl
        const cached = imageDataUrlCache.get(sourceUrl)
        if (cached) return cached
        const promise = (async () => {
          const response = await fetch(sourceUrl)
          if (!response.ok) {
            throw new Error(`Failed to load source image (${response.status})`)
          }
          const blob = await response.blob()
          return blobToDataUrl(blob)
        })()
        imageDataUrlCache.set(sourceUrl, promise)
        return promise
      }

      function getSourceImageUrl(element) {
        if (!element) return null
        if (element.tagName === "IMG") {
          return element.currentSrc || element.src || null
        }
        if (element.tagName === "PICTURE") {
          const img = element.querySelector("img")
          return img ? img.currentSrc || img.src || null : null
        }
        const bg = element.style.backgroundImage
        if (!bg || bg === "none") return null
        const match = bg.match(/^url\((['"]?)(.*)\1\)$/)
        return match ? match[2] : null
      }

      function clearBlurPresentation(wrapper, sourceEl) {
        wrapper.classList.remove("preview-wrapper-lqip")
        wrapper.style.removeProperty("--css-blur")
        sourceEl.dataset.cssFilter = "0"
        applyCssBlur(sourceEl, 0)
        const overlay = wrapper.querySelector(".blur-overlay")
        if (overlay) {
          overlay.remove()
        }
      }

      function setSvgFilterBlurAmount(cssBlurPx) {
        const svgBlurNode = document.querySelector("#svgBlur feGaussianBlur")
        if (svgBlurNode) {
          svgBlurNode.setAttribute("stdDeviation", String(cssBlurPx))
        }
      }

      async function applyBlurPresentation(wrapper, sourceEl, image, state) {
        const renderToken = String(Number(wrapper.dataset.blurRenderToken || "0") + 1)
        wrapper.dataset.blurRenderToken = renderToken
        clearBlurPresentation(wrapper, sourceEl)
        if (state.cssBlurPx <= 0) return

        const blurMode = normalizeBlurMode(state.blurMode)
        if (blurMode === "sharp") return

        if (blurMode === "backdrop") {
          wrapper.classList.add("preview-wrapper-lqip")
          wrapper.style.setProperty("--css-blur", `${state.cssBlurPx}px`)
          return
        }

        if (blurMode === "filter") {
          sourceEl.dataset.cssFilter = "1"
          applyCssBlur(sourceEl, state.cssBlurPx)
          return
        }

        const sourceUrl = getSourceImageUrl(sourceEl)
        if (!sourceUrl) return
        const sourceDataUrl = await getImageDataUrl(sourceUrl).catch(() => null)
        if (!sourceDataUrl || wrapper.dataset.blurRenderToken !== renderToken) return

        if (blurMode === "svg-filter-css") {
          const overlay = document.createElement("div")
          overlay.className = "blur-overlay"
          setSvgFilterBlurAmount(state.cssBlurPx)
          const encodedSvg = svgBlurImage(
            sourceDataUrl,
            image.dimensions.width,
            image.dimensions.height,
            0
          )
          overlay.style.backgroundImage = cssUrl(`data:image/svg+xml;charset=utf-8,${encodedSvg}`)
          overlay.style.filter = "url(#svgBlur)"
          if (wrapper.dataset.blurRenderToken !== renderToken) return
          wrapper.appendChild(overlay)
          return
        }

        if (blurMode === "svg-filter") {
          const encodedSvg = encodeURIComponent(
            svgBlurImage(
              sourceDataUrl,
              image.dimensions.width,
              image.dimensions.height,
              state.cssBlurPx
            )
          )
          if (wrapper.dataset.blurRenderToken !== renderToken) return
          sourceEl.src = `data:image/svg+xml;charset=utf-8,${encodedSvg}`
          return
        }

        if (blurMode === "nextjs-blur") {
          const nextjsSvg = getImageBlurSvg({
            widthInt: image.dimensions.width,
            heightInt: image.dimensions.height,
            blurWidth: image.dimensions.width,
            blurHeight: image.dimensions.height,
            blurDataURL: sourceDataUrl,
            objectFit: "cover",
            blurStd: state.cssBlurPx
          })
          if (wrapper.dataset.blurRenderToken !== renderToken) return
          sourceEl.src = `data:image/svg+xml;charset=utf-8,${nextjsSvg}`
        }
      }

      function clearTable() {
        document.querySelector("#header-row").innerHTML = ""
        document.querySelector("#rows").innerHTML = ""
      }

      function renderHeader(visibleVariants) {
        const headerRow = document.querySelector("#header-row")
        for (const variant of visibleVariants) {
          const th = document.createElement("th")
          th.textContent = variant.label
          if (variant.selected) th.classList.add("selected")
          headerRow.appendChild(th)
        }
      }

      function createSizeLabel() {
        const sizeLabel = document.createElement("div")
        sizeLabel.className = "size-below"
        sizeLabel.textContent = "..."
        return sizeLabel
      }

      function getRowAnchorId(image, index) {
        const slug = String(image.filename || "")
          .toLowerCase()
          .replace(/[^a-z0-9]+/g, "-")
          .replace(/^-+|-+$/g, "")
        return `row-${index + 1}-${slug || "image"}`
      }

      function setSizeLabel(sizeLabel, bytes, strippedBytes = null) {
        sizeLabel.dataset.sizeBytes = String(bytes)
        const strippedText =
          strippedBytes !== null && Number.isFinite(strippedBytes)
            ? ` (${formatBytes(strippedBytes)})`
            : ""
        sizeLabel.dataset.baseText = `${formatBytes(bytes)}${strippedText}`
        sizeLabel.textContent = sizeLabel.dataset.baseText
      }

      function updateRowTrophy(row) {
        const labels = [...row.querySelectorAll(".size-below")]
        let minBytes = Number.POSITIVE_INFINITY

        for (const label of labels) {
          const bytes = Number(label.dataset.sizeBytes)
          if (Number.isFinite(bytes) && bytes >= 0) {
            minBytes = Math.min(minBytes, bytes)
          }
        }

        for (const label of labels) {
          const bytes = Number(label.dataset.sizeBytes)
          const baseText = label.dataset.baseText || label.textContent || ""
          if (Number.isFinite(bytes) && bytes === minBytes && minBytes < Number.POSITIVE_INFINITY) {
            label.classList.add("is-winner")
            label.textContent = `🏆 ${baseText}`
          } else {
            label.classList.remove("is-winner")
            label.textContent = baseText
          }
        }
      }

      function renderStaticCell(cell, image, variant, result, state, row) {
        const wrapper = document.createElement("div")
        wrapper.className = "preview-wrapper"
        wrapper.style.paddingBottom = `${(image.dimensions.height / image.dimensions.width) * 100}%`
        const sizeLabel = createSizeLabel()

        if (variant.type === "thumbnail") {
          const img = document.createElement("img")
          img.className = "preview"
          img.src = `processed/${result.name}`
          img.alt = result.name
          const anchor = document.createElement("a")
          anchor.className = "preview-anchor"
          anchor.href = `#${row.id}`
          anchor.setAttribute("aria-label", `Anchor row for ${image.filename}`)
          anchor.appendChild(img)
          wrapper.appendChild(anchor)
          setSizeLabel(sizeLabel, result.sizeBytes)
        } else if (variant.type === "css-lqip") {
          const preview = document.createElement("picture")
          preview.className = "css-lqip-preview"
          preview.style.setProperty("--lqip", result.lqip)
          const img = document.createElement("img")
          img.src = `processed/${image.thumbnail.name}`
          img.alt = `${image.filename}-css-lqip`
          preview.appendChild(img)
          wrapper.appendChild(preview)
          setSizeLabel(sizeLabel, result.sizeBytes)
        } else {
          const preview = document.createElement("div")
          preview.className = "css-preview"
          preview.setAttribute("style", result.css)
          wrapper.appendChild(preview)
          setSizeLabel(sizeLabel, result.sizeBytes)
        }

        cell.appendChild(wrapper)
        cell.appendChild(sizeLabel)
      }

      function renderModernCell(cell, image, variant, state, row) {
        const wrapper = document.createElement("div")
        wrapper.className = "preview-wrapper is-loading"
        wrapper.style.paddingBottom = `${(image.dimensions.height / image.dimensions.width) * 100}%`
        const img = document.createElement("img")
        img.className = "preview"
        img.alt = `${image.filename}-${variant.id}`
        wrapper.appendChild(img)
        const sizeLabel = createSizeLabel()

        void applyBlurPresentation(wrapper, img, image, state)

        const url = modernUrl(image, variant, state)
        loadModernPreview(url)
          .then(({ objectUrl, sizeBytes, strippedBytes }) => {
            img.src = objectUrl
            void applyBlurPresentation(wrapper, img, image, state)
            const displayStrippedBytes =
              variant.format === "avif" ? strippedBytes : null
            setSizeLabel(sizeLabel, sizeBytes, displayStrippedBytes)
            wrapper.classList.remove("is-loading")
            updateRowTrophy(row)
          })
          .catch((error) => {
            sizeLabel.textContent = error.message
            delete sizeLabel.dataset.sizeBytes
            delete sizeLabel.dataset.baseText
            wrapper.classList.remove("is-loading")
            updateRowTrophy(row)
          })

        cell.appendChild(wrapper)
        cell.appendChild(sizeLabel)
      }

      function renderRows(images, visibleVariants, state) {
        const tbody = document.querySelector("#rows")
        for (const [index, image] of images.entries()) {
          const row = document.createElement("tr")
          row.id = getRowAnchorId(image, index)
          for (const variant of visibleVariants) {
            const cell = document.createElement("td")
            if (variant.selected) cell.classList.add("selected")

            if (variant.format) {
              renderModernCell(cell, image, variant, state, row)
            } else {
              const result = getStaticResult(image, variant.id)
              if (!result) {
                cell.textContent = "-"
              } else {
                renderStaticCell(cell, image, variant, result, state, row)
              }
            }

            row.appendChild(cell)
          }
          updateRowTrophy(row)
          tbody.appendChild(row)
        }
      }

      function renderTable(images, state) {
        const visibleVariants = getVisibleVariants(state)
        clearTable()
        renderHeader(visibleVariants)
        renderRows(images, visibleVariants, state)
      }

      function setupVisibilityControls(state, onChange) {
        const root = document.querySelector("#variant-visibility")
        root.innerHTML = ""
        for (const variant of VARIANTS) {
          const label = document.createElement("label")
          const checkbox = document.createElement("input")
          checkbox.type = "checkbox"
          checkbox.checked = state.visibleVariantIds.has(variant.id)
          checkbox.addEventListener("change", () => {
            if (checkbox.checked) state.visibleVariantIds.add(variant.id)
            else state.visibleVariantIds.delete(variant.id)
            onChange()
          })
          label.appendChild(checkbox)
          label.appendChild(document.createTextNode(variant.label))
          root.appendChild(label)
        }
      }

      function setupControls({ controlsConfig, state, onChange }) {
        const controlsRoot = document.querySelector("#controls")
        const webpQualityEl = document.querySelector("#webp-quality")
        const avifQualityEl = document.querySelector("#avif-quality")
        const webpQualityValueEl = document.querySelector("#webp-quality-value")
        const avifQualityValueEl = document.querySelector("#avif-quality-value")
        const sharpBlurLevelEl = document.querySelector("#sharp-blur-level")
        const blurModeEl = document.querySelector("#blur-mode")
        const sharpBlurTargetEl = document.querySelector("#sharp-blur-target")
        const cssBlurEl = document.querySelector("#css-blur")
        const cssBlurValueEl = document.querySelector("#css-blur-value")

        const avifLosslessEl = document.querySelector("#avif-lossless")
        const avifChroma444El = document.querySelector("#avif-chroma-444")
        const avifBitdepthEl = document.querySelector("#avif-bitdepth")
        const webpSmartSubsampleEl = document.querySelector("#webp-smart-subsample")
        const webpSmartDeblockEl = document.querySelector("#webp-smart-deblock")
        const webpAlphaQualityEl = document.querySelector("#webp-alpha-quality")
        const webpAlphaQualityValueEl = document.querySelector("#webp-alpha-quality-value")
        const webpLosslessEl = document.querySelector("#webp-lossless")
        const webpNearLosslessEl = document.querySelector("#webp-near-lossless")

        webpQualityEl.max = String(qualityOptions.length - 1)
        avifQualityEl.max = String(qualityOptions.length - 1)
        webpQualityEl.value = String(qualityIndex(state.webpQuality))
        avifQualityEl.value = String(qualityIndex(state.avifQuality))
        webpQualityValueEl.textContent = String(state.webpQuality)
        avifQualityValueEl.textContent = String(state.avifQuality)

        sharpBlurLevelEl.innerHTML = ""
        for (const level of controlsConfig.blurLevels) {
          const option = document.createElement("option")
          option.value = level.id
          option.textContent = `${level.label} (sigma ${level.sharpSigma})`
          option.selected = level.id === state.sharpBlurLevel
          sharpBlurLevelEl.appendChild(option)
        }

        blurModeEl.value = state.blurMode
        sharpBlurTargetEl.value = state.sharpBlurTarget
        cssBlurEl.value = String(state.cssBlurPx)
        cssBlurValueEl.textContent = `${state.cssBlurPx}px`

        avifLosslessEl.checked = state.avifLossless
        avifChroma444El.checked = state.avifChromaSubsampling444
        avifBitdepthEl.value = String(state.avifBitdepth)
        webpSmartSubsampleEl.checked = state.webpSmartSubsample
        webpSmartDeblockEl.checked = state.webpSmartDeblock
        webpAlphaQualityEl.value = String(state.webpAlphaQuality)
        webpAlphaQualityValueEl.textContent = String(state.webpAlphaQuality)
        webpLosslessEl.checked = state.webpLossless
        webpNearLosslessEl.checked = state.webpNearLossless

        function syncDisabled() {
          const sharpMode = state.blurMode === "sharp"
          const clientMode = !sharpMode
          sharpBlurTargetEl.disabled = !sharpMode
          sharpBlurLevelEl.disabled = !sharpMode
          for (const element of document.querySelectorAll(".sharp-only")) {
            element.hidden = !sharpMode
          }
          for (const element of document.querySelectorAll(".quality-options")) {
            element.hidden = !(clientMode || (sharpMode && state.sharpBlurLevel === "0"))
          }
        }

        webpQualityEl.addEventListener("input", () => {
          state.webpQuality = qualityAt(Number(webpQualityEl.value))
          webpQualityValueEl.textContent = String(state.webpQuality)
          onChange()
        })
        avifQualityEl.addEventListener("input", () => {
          state.avifQuality = qualityAt(Number(avifQualityEl.value))
          avifQualityValueEl.textContent = String(state.avifQuality)
          onChange()
        })
        sharpBlurLevelEl.addEventListener("change", () => {
          state.sharpBlurLevel = sharpBlurLevelEl.value
          onChange()
        })
        blurModeEl.addEventListener("change", () => {
          state.blurMode = normalizeBlurMode(blurModeEl.value)
          syncDisabled()
          onChange()
        })
        sharpBlurTargetEl.addEventListener("change", () => {
          state.sharpBlurTarget = sharpBlurTargetEl.value
          onChange()
        })

        cssBlurEl.addEventListener("input", () => {
          state.cssBlurPx = Number(cssBlurEl.value)
          cssBlurValueEl.textContent = `${state.cssBlurPx}px`
          onChange()
        })

        for (const [el, key] of [
          [avifLosslessEl, "avifLossless"],
          [avifChroma444El, "avifChromaSubsampling444"],
          [webpSmartSubsampleEl, "webpSmartSubsample"],
          [webpSmartDeblockEl, "webpSmartDeblock"],
          [webpLosslessEl, "webpLossless"],
          [webpNearLosslessEl, "webpNearLossless"]
        ]) {
          el.addEventListener("change", () => {
            state[key] = el.checked
            onChange()
          })
        }
        avifBitdepthEl.addEventListener("change", () => {
          state.avifBitdepth = Number(avifBitdepthEl.value)
          onChange()
        })
        webpAlphaQualityEl.addEventListener("input", () => {
          state.webpAlphaQuality = Number(webpAlphaQualityEl.value)
          webpAlphaQualityValueEl.textContent = String(state.webpAlphaQuality)
          onChange()
        })

        setupVisibilityControls(state, onChange)
        syncDisabled()
        controlsRoot.hidden = false
      }

      async function init() {
        const statusEl = document.querySelector("#status")
        const tableEl = document.querySelector("#comparison-table")

        try {
          const response = await fetch("./dataset.json")
          if (!response.ok) {
            throw new Error(`Failed to load dataset: ${response.status}`)
          }

          const payload = await response.json()
          const controlsConfig = payload.controls
          const images = payload.images

          qualityOptions.splice(0, qualityOptions.length, ...controlsConfig.qualityOptions)

          const defaults = controlsConfig.defaults
          const state = {
            webpQuality: defaults.webpQuality,
            avifQuality: defaults.avifQuality,
            sharpBlurLevel: defaults.sharpBlurLevel,
            blurMode: normalizeBlurMode(defaults.blurMode),
            sharpBlurTarget: defaults.sharpBlurTarget,
            cssBlurPx: defaults.cssBlurPx,
            avifLossless: defaults.avifLossless,
            avifChromaSubsampling444: defaults.avifChromaSubsampling444,
            avifBitdepth: defaults.avifBitdepth,
            webpSmartSubsample: defaults.webpSmartSubsample,
            webpSmartDeblock: defaults.webpSmartDeblock,
            webpAlphaQuality: defaults.webpAlphaQuality,
            webpLossless: defaults.webpLossless,
            webpNearLossless: defaults.webpNearLossless,
            visibleVariantIds: new Set(
              VARIANTS.filter((variant) => variant.defaultVisible !== false).map(
                (variant) => variant.id
              )
            )
          }

          hydrateStateFromQuery(state, controlsConfig)

          const rerender = (syncQuery = false) => {
            renderTable(images, state)
            if (syncQuery) {
              syncQueryParams(state)
            }
          }
          setupControls({
            controlsConfig,
            state,
            onChange: () => rerender(true)
          })

          rerender()
          statusEl.remove()
          tableEl.hidden = false
        } catch (error) {
          statusEl.className = "error"
          statusEl.textContent = `Error loading comparison data: ${error.message}`
        }
      }

      init()
    </script>
  </body>
</html>
