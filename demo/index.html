<html>
  <head>
    <meta charset="UTF-8" />
    <title>LQIP comparison demo</title>
    <link rel="stylesheet" href="./assets/cssLQIP.css" />
    <style type="text/css">
      body {
        font-family: sans-serif;
        background: #000;
        color: #fff;
        padding: 2rem;
      }

      a {
        color: tomato;
      }

      a:visited {
        color: firebrick;
      }

      h1 {
        display: flex;
        align-items: center;
        gap: 1rem;
      }

      table {
        border-collapse: collapse;
        border-spacing: 0;
        table-layout: fixed;
        width: 100%;
      }

      td,
      th {
        width: 240px;
        vertical-align: top;
      }

      th {
        text-align: left;
        padding: 1rem;
      }

      td {
        padding: 0;
      }

      .description {
        padding: 1rem;
        font-size: 0.85em;
      }

      .selected {
        background: #0a5f0a;
      }

      .processing-time img {
        vertical-align: text-bottom;
      }

      .preview-wrapper {
        position: relative;
        height: 0;
        overflow: hidden;
      }

      .preview,
      .css-preview {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }

      .preview {
        display: block;
        object-fit: cover;
      }

      .css-preview {
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
      }

      .preview-wrapper-lqip::after {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        backdrop-filter: blur(var(--css-blur, 20px));
        -webkit-backdrop-filter: blur(var(--css-blur, 20px));
        pointer-events: none;
      }

      .overlay {
        display: none;
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        bottom: 0;
        background: rgba(0, 0, 0, 0.75);
        color: #fff;
        padding: 1rem;
        font-size: 0.85em;
        overflow: auto;
      }

      td:hover .overlay {
        display: block;
      }

      .overlay table {
        font-size: 0.95em;
        table-layout: auto;
      }

      .overlay td,
      .overlay th {
        width: auto;
        padding: 0.25rem;
        text-align: left;
      }

      .overlay code {
        display: block;
        white-space: pre-wrap;
        word-break: break-word;
        font-family: monospace;
      }

      .loading,
      .error {
        margin-top: 1rem;
      }

      .controls {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 0.75rem 1rem;
        margin: 1.5rem 0;
        padding: 1rem;
        border: 1px solid #222;
        background: #111;
      }

      .controls label {
        font-size: 0.85rem;
        display: grid;
        gap: 0.4rem;
      }

      .controls select {
        background: #1b1b1b;
        color: #fff;
        border: 1px solid #333;
        border-radius: 4px;
        padding: 0.35rem 0.5rem;
      }

      .controls .inline {
        display: flex;
        gap: 0.75rem;
        align-items: center;
      }

      .controls .inline label {
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
      }

      .controls .helper {
        color: #aaa;
        font-size: 0.75rem;
      }
    </style>
  </head>
  <body>
    <h1>
      LQIP Comparison Demo
      <a href="https://github.com/transitive-bullshit/lqip-modern">
        <img src="./assets/github.svg" width="32" alt="GitHub" />
      </a>
    </h1>

    <p>
      LQIP (Low Quality Image Placeholders) generates efficient placeholder
      previews for image-heavy pages to improve perceived loading.
    </p>
    <p>
      This comparison focuses on modern techniques and removes older SVG/JPEG
      placeholder methods.
    </p>

    <div id="status" class="loading">Loading comparison data...</div>

    <div id="controls" class="controls" hidden>
      <label>
        WebP quality
        <select id="webp-quality"></select>
      </label>

      <label>
        AVIF quality
        <select id="avif-quality"></select>
      </label>

      <label>
        Blur level
        <select id="blur-level"></select>
        <span class="helper">Sharp blur for encoded images, CSS blur for generated CSS placeholders.</span>
      </label>

      <label>
        Blur mode
        <select id="blur-mode">
          <option value="css">CSS blur</option>
          <option value="sharp">Sharp blur in image bytes</option>
        </select>
      </label>

      <label>
        Sharp blur target
        <select id="sharp-blur-target">
          <option value="placeholder">Apply blur on placeholder</option>
          <option value="original">Apply blur on original image</option>
        </select>
      </label>
    </div>

    <table id="comparison-table" hidden>
      <thead>
        <tr id="header-row"></tr>
        <tr id="description-row"></tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>

    <script type="module">
      const VARIANTS = [
        {
          id: "thumbnail",
          label: "Thumbnail",
          type: "thumbnail",
          description:
            "300px JPEG thumbnail baseline generated with sharp and mozjpeg."
        },
        {
          id: "modern-webp-8",
          label: "LQIP modern webp @ 8px",
          type: "modern",
          format: "webp",
          size: 8
        },
        {
          id: "modern-avif-8",
          label: "LQIP modern avif @ 8px",
          type: "modern",
          format: "avif",
          size: 8
        },
        {
          id: "modern-webp-16",
          label: "LQIP modern webp @ 16px",
          type: "modern",
          format: "webp",
          size: 16,
          selected: true
        },
        {
          id: "modern-avif-16",
          label: "LQIP modern avif @ 16px",
          type: "modern",
          format: "avif",
          size: 16
        },
        {
          id: "modern-webp-32",
          label: "LQIP modern webp @ 32px",
          type: "modern",
          format: "webp",
          size: 32
        },
        {
          id: "modern-avif-32",
          label: "LQIP modern avif @ 32px",
          type: "modern",
          format: "avif",
          size: 32
        },
        {
          id: "gip",
          label: "gip (cssgip)",
          type: "css",
          description:
            "Gradient Image Placeholders generated with cssgip as CSS gradients."
        },
        {
          id: "css-lqip",
          label: "CSS-LQIP (2026)",
          type: "css-lqip",
          description:
            "Compact numeric CSS-LQIP value rendered with modern CSS gradients."
        },
        {
          id: "blurhash-as-css-gradient",
          label: "blurhash-as-css-gradient",
          type: "css",
          description:
            "BlurHash rendered as CSS gradients via @unpic/placeholder."
        },
        {
          id: "blurhash-as-css",
          label: "blurhash-as-css",
          type: "css",
          description:
            "BlurHash rendered as CSS object output from blurhash-to-css."
        }
      ]

      function average(values) {
        if (!values.length) return 0
        return values.reduce((acc, value) => acc + value, 0) / values.length
      }

      function formatSeconds(tuple) {
        const seconds = tuple[0] + tuple[1] / 1_000_000_000
        return `${seconds.toFixed(3)}s`
      }

      function percent(value, baseline) {
        if (!baseline) return "n/a"
        return `${((value / baseline) * 100).toFixed(2)}%`
      }

      function escapeHtml(text) {
        return text
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
      }

      function getResultByName(image, variantName) {
        return image.results.find((result) => result.variantName === variantName)
      }

      function modernVariantName({
        format,
        size,
        quality,
        blurLevel,
        blurTarget
      }) {
        return `lqip-modern-${format}-${size}-q${quality}-b${blurLevel}-t${blurTarget}`
      }

      function getBlurConfig(controlsConfig, blurLevelId) {
        return controlsConfig.blurLevels.find((level) => level.id === blurLevelId)
      }

      function resolveVariantResult(image, variant, controlsConfig, state) {
        if (variant.type === "modern") {
          const quality =
            variant.format === "webp" ? state.webpQuality : state.avifQuality
          const blurMode = state.blurMode
          const blurLevel = blurMode === "css" ? "0" : state.blurLevel
          const blurTarget =
            blurMode === "css" || blurLevel === "0"
              ? "none"
              : state.sharpBlurTarget
          const variantName = modernVariantName({
            format: variant.format,
            size: variant.size,
            quality,
            blurLevel,
            blurTarget
          })

          const result = getResultByName(image, variantName)
          const blurConfig = getBlurConfig(controlsConfig, state.blurLevel)
          const cssBlurPx = blurMode === "css" ? blurConfig.cssPx : 0

          return { result, cssBlurPx }
        }

        if (variant.type === "thumbnail") {
          return { result: getResultByName(image, variant.id), cssBlurPx: 0 }
        }

        const blurConfig = getBlurConfig(controlsConfig, state.blurLevel)
        return {
          result: getResultByName(image, variant.id),
          cssBlurPx: blurConfig.cssPx
        }
      }

      function variantDescription(variant, controlsConfig, state) {
        if (variant.type !== "modern") {
          return variant.description
        }

        const quality = variant.format === "webp" ? state.webpQuality : state.avifQuality
        const blurConfig = getBlurConfig(controlsConfig, state.blurLevel)

        if (state.blurMode === "css") {
          return `${variant.size}px ${variant.format.toUpperCase()} placeholder with quality ${quality}. Blur applied via CSS (${blurConfig.cssPx}px).`
        }

        const targetLabel =
          state.sharpBlurTarget === "original"
            ? "original image"
            : "placeholder image"

        return `${variant.size}px ${variant.format.toUpperCase()} placeholder with quality ${quality}. Blur baked with sharp (sigma ${blurConfig.sharpSigma}) on ${targetLabel}.`
      }

      function clearTable() {
        document.querySelector("#header-row").innerHTML = ""
        document.querySelector("#description-row").innerHTML = ""
        document.querySelector("#rows").innerHTML = ""
      }

      function renderHeader(images, controlsConfig, state) {
        const headerRow = document.querySelector("#header-row")
        const descriptionRow = document.querySelector("#description-row")
        const avgBaselineBytes = average(
          images
            .map((image) => getResultByName(image, "thumbnail"))
            .filter(Boolean)
            .map((result) => result.sizes.originalBytes)
        )

        for (const variant of VARIANTS) {
          const resolved = images
            .map((image) => resolveVariantResult(image, variant, controlsConfig, state))
            .map((entry) => entry.result)
            .filter(Boolean)

          const avgProcessingNs = average(
            resolved.map(
              (result) => result.processTime[0] * 1_000_000_000 + result.processTime[1]
            )
          )
          const avgSizeBytes = average(
            resolved.map((result) => result.sizes.originalBytes)
          )

          const th = document.createElement("th")
          th.textContent = variant.label
          if (variant.selected) th.classList.add("selected")
          headerRow.appendChild(th)

          const td = document.createElement("td")
          if (variant.selected) td.classList.add("selected")
          td.innerHTML = `
            <div class="description">
              <p>${escapeHtml(variantDescription(variant, controlsConfig, state))}</p>
              <p class="processing-time">
                <img alt="average processing time" src="./assets/processing-time.svg" width="20" />
                <span title="Average processing time">${(avgProcessingNs / 1_000_000_000).toFixed(3)}s</span>
                <span title="Average size"> | ø ${Math.round(avgSizeBytes)} B</span>
                <span title="Average size compared to thumbnail"> | ${percent(avgSizeBytes, avgBaselineBytes)}</span>
              </p>
            </div>
          `
          descriptionRow.appendChild(td)
        }
      }

      function applyCssBlur(previewElement, cssBlurPx) {
        if (cssBlurPx > 0) {
          previewElement.style.filter = `blur(${cssBlurPx}px)`
          previewElement.style.transform = "scale(1.08)"
        }
      }

      function renderImageCell({
        cell,
        image,
        result,
        cssBlurPx,
        variant,
        thumbnailResult
      }) {
        const wrapper = document.createElement("div")
        wrapper.className = "preview-wrapper"
        wrapper.style.paddingBottom = `${(image.dimensions.height / image.dimensions.width) * 100}%`

        if (variant.type === "modern" && cssBlurPx > 0) {
          wrapper.classList.add("preview-wrapper-lqip")
          wrapper.style.setProperty("--css-blur", `${cssBlurPx}px`)
        }

        if (result.kind === "image" || result.kind === "modern-image") {
          const img = document.createElement("img")
          img.className = "preview"
          img.src = `processed/${result.name}`
          img.alt = result.name
          wrapper.appendChild(img)
        } else if (result.kind === "css-lqip") {
          const preview = document.createElement("picture")
          preview.className = "css-lqip-preview"
          preview.style.setProperty("--lqip", result.lqip)
          applyCssBlur(preview, cssBlurPx)

          const img = document.createElement("img")
          img.src = `processed/${thumbnailResult.name}`
          img.alt = `${image.filename}-css-lqip`
          preview.appendChild(img)
          wrapper.appendChild(preview)
        } else {
          const preview = document.createElement("div")
          preview.className = "css-preview"
          preview.setAttribute("style", result.css)
          applyCssBlur(preview, cssBlurPx)
          wrapper.appendChild(preview)
        }

        const overlay = document.createElement("div")
        overlay.className = "overlay"
        overlay.innerHTML = `
          <div>
            ${
              result.kind === "image" || result.kind === "modern-image"
                ? `<a href="processed/${result.name}">${result.name}</a>`
                : `<code>${escapeHtml(
                    result.kind === "css-lqip" ? result.lqip : result.css
                  )}</code>`
            }
          </div>
          <table>
            <tbody>
              <tr><th>Dimensions</th><td>${result.dimensions.width} x ${result.dimensions.height}</td></tr>
              <tr><th>Ratio</th><td>${result.dimensions.ratio}</td></tr>
              <tr><th>Original size</th><td>${result.sizes.originalHuman}</td></tr>
              <tr><th>Gzip size</th><td>${result.sizes.gzipHuman}</td></tr>
              <tr><th>Brotli size</th><td>${result.sizes.brotliHuman}</td></tr>
              <tr><th>Proc time</th><td>${formatSeconds(result.processTime)}</td></tr>
              <tr><th>Size vs thumbnail</th><td>${percent(
                result.sizes.originalBytes,
                thumbnailResult.sizes.originalBytes
              )}</td></tr>
            </tbody>
          </table>
        `
        wrapper.appendChild(overlay)
        cell.appendChild(wrapper)
      }

      function renderRows(images, controlsConfig, state) {
        const tbody = document.querySelector("#rows")

        for (const image of images) {
          const row = document.createElement("tr")
          const thumbnailResult = getResultByName(image, "thumbnail")
          if (!thumbnailResult) continue

          for (const variant of VARIANTS) {
            const cell = document.createElement("td")
            if (variant.selected) {
              cell.classList.add("selected")
            }

            const { result, cssBlurPx } = resolveVariantResult(
              image,
              variant,
              controlsConfig,
              state
            )

            if (!result) {
              cell.textContent = "-"
              row.appendChild(cell)
              continue
            }

            renderImageCell({
              cell,
              image,
              result,
              cssBlurPx,
              variant,
              thumbnailResult
            })
            row.appendChild(cell)
          }

          tbody.appendChild(row)
        }
      }

      function renderTable(images, controlsConfig, state) {
        clearTable()
        renderHeader(images, controlsConfig, state)
        renderRows(images, controlsConfig, state)
      }

      function selectOptions(select, values, selected) {
        select.innerHTML = ""
        for (const value of values) {
          const option = document.createElement("option")
          option.value = String(value)
          option.textContent = String(value)
          option.selected = String(value) === String(selected)
          select.appendChild(option)
        }
      }

      function setupControls({ controlsConfig, state, onChange }) {
        const controlsRoot = document.querySelector("#controls")
        const webpQualityEl = document.querySelector("#webp-quality")
        const avifQualityEl = document.querySelector("#avif-quality")
        const blurLevelEl = document.querySelector("#blur-level")
        const blurModeEl = document.querySelector("#blur-mode")
        const sharpBlurTargetEl = document.querySelector("#sharp-blur-target")

        selectOptions(
          webpQualityEl,
          controlsConfig.webpQualityOptions,
          state.webpQuality
        )
        selectOptions(
          avifQualityEl,
          controlsConfig.avifQualityOptions,
          state.avifQuality
        )

        blurLevelEl.innerHTML = ""
        for (const level of controlsConfig.blurLevels) {
          const option = document.createElement("option")
          option.value = level.id
          option.textContent = `${level.label} (sigma ${level.sharpSigma}, css ${level.cssPx}px)`
          option.selected = level.id === state.blurLevel
          blurLevelEl.appendChild(option)
        }

        selectOptions(
          sharpBlurTargetEl,
          controlsConfig.blurTargets,
          state.sharpBlurTarget
        )
        blurModeEl.value = state.blurMode

        function syncDisabledStates() {
          sharpBlurTargetEl.disabled = state.blurMode !== "sharp"
        }

        webpQualityEl.addEventListener("change", () => {
          state.webpQuality = Number(webpQualityEl.value)
          onChange()
        })
        avifQualityEl.addEventListener("change", () => {
          state.avifQuality = Number(avifQualityEl.value)
          onChange()
        })
        blurLevelEl.addEventListener("change", () => {
          state.blurLevel = blurLevelEl.value
          onChange()
        })
        blurModeEl.addEventListener("change", () => {
          state.blurMode = blurModeEl.value
          syncDisabledStates()
          onChange()
        })
        sharpBlurTargetEl.addEventListener("change", () => {
          state.sharpBlurTarget = sharpBlurTargetEl.value
          onChange()
        })

        syncDisabledStates()
        controlsRoot.hidden = false
      }

      async function init() {
        const statusEl = document.querySelector("#status")
        const tableEl = document.querySelector("#comparison-table")

        try {
          const response = await fetch("./dataset.json")
          if (!response.ok) {
            throw new Error(`Failed to load dataset: ${response.status}`)
          }

          const payload = await response.json()
          const controlsConfig = payload.controls
          const images = payload.images

          const state = {
            webpQuality: controlsConfig.defaults.webpQuality,
            avifQuality: controlsConfig.defaults.avifQuality,
            blurLevel: controlsConfig.defaults.blurLevel,
            blurMode: controlsConfig.defaults.blurMode,
            sharpBlurTarget: controlsConfig.defaults.sharpBlurTarget
          }

          setupControls({
            controlsConfig,
            state,
            onChange: () => renderTable(images, controlsConfig, state)
          })

          renderTable(images, controlsConfig, state)
          statusEl.remove()
          tableEl.hidden = false
        } catch (error) {
          statusEl.className = "error"
          statusEl.textContent = `Error loading comparison data: ${error.message}`
        }
      }

      init()
    </script>
  </body>
</html>
