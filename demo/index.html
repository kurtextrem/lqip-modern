<html>
  <head>
    <meta charset="UTF-8" />
    <title>LQIP comparison demo</title>
    <link rel="stylesheet" href="./assets/cssLQIP.css" />
    <style type="text/css">
      body {
        font-family: sans-serif;
        background: #000;
        color: #fff;
        padding: 2rem;
      }

      a {
        color: tomato;
      }

      a:visited {
        color: firebrick;
      }

      h1 {
        display: flex;
        align-items: center;
        gap: 1rem;
      }

      table {
        border-collapse: collapse;
        border-spacing: 0;
        table-layout: fixed;
        width: 100%;
      }

      td,
      th {
        width: 240px;
        vertical-align: top;
      }

      th {
        text-align: left;
        padding: 1rem;
      }

      td {
        padding: 0;
      }

      .description {
        padding: 1rem;
        font-size: 0.85em;
      }

      .selected {
        background: #0a5f0a;
      }

      .processing-time img {
        vertical-align: text-bottom;
      }

      .preview-wrapper {
        position: relative;
        height: 0;
        overflow: hidden;
      }

      .preview,
      .css-preview {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }

      .preview {
        display: block;
        object-fit: cover;
      }

      .css-preview {
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
      }

      .preview-wrapper-lqip::after {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        pointer-events: none;
      }

      .overlay {
        display: none;
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        bottom: 0;
        background: rgba(0, 0, 0, 0.75);
        color: #fff;
        padding: 1rem;
        font-size: 0.85em;
        overflow: auto;
      }

      td:hover .overlay {
        display: block;
      }

      .overlay table {
        font-size: 0.95em;
        table-layout: auto;
      }

      .overlay td,
      .overlay th {
        width: auto;
        padding: 0.25rem;
        text-align: left;
      }

      .overlay code {
        display: block;
        white-space: pre-wrap;
        word-break: break-word;
        font-family: monospace;
      }

      .loading,
      .error {
        margin-top: 1rem;
      }
    </style>
  </head>
  <body>
    <h1>
      LQIP Comparison Demo
      <a href="https://github.com/transitive-bullshit/lqip-modern">
        <img src="./assets/github.svg" width="32" alt="GitHub" />
      </a>
    </h1>

    <p>
      LQIP (Low Quality Image Placeholders) generates efficient placeholder
      previews for image-heavy pages to improve perceived loading.
    </p>
    <p>
      This comparison focuses on modern techniques and removes older SVG/JPEG
      placeholder methods.
    </p>

    <div id="status" class="loading">Loading comparison data...</div>
    <table id="comparison-table" hidden>
      <thead>
        <tr id="header-row"></tr>
        <tr id="description-row"></tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>

    <script type="module">
      const VARIANTS = [
        {
          id: 'thumbnail',
          label: 'Thumbnail',
          description:
            '300px JPEG thumbnail baseline generated with sharp and mozjpeg.'
        },
        {
          id: 'lqip-modern-webp-8',
          label: 'LQIP modern webp @ 8px',
          description:
            '8px WebP thumbnail generated by lqip-modern and blurred with 20px.'
        },
        {
          id: 'lqip-modern-avif-8',
          label: 'LQIP modern avif @ 8px',
          description:
            '8px AVIF thumbnail generated by lqip-modern and blurred with 20px.'
        },
        {
          id: 'lqip-modern-webp-16',
          label: 'LQIP modern webp @ 16px',
          description:
            '16px WebP thumbnail generated by lqip-modern and blurred with 20px.',
          selected: true
        },
        {
          id: 'lqip-modern-avif-16',
          label: 'LQIP modern avif @ 16px',
          description:
            '16px AVIF thumbnail generated by lqip-modern and blurred with 20px.'
        },
        {
          id: 'lqip-modern-webp-32',
          label: 'LQIP modern webp @ 32px',
          description:
            '32px WebP thumbnail generated by lqip-modern and blurred with 20px.'
        },
        {
          id: 'lqip-modern-avif-32',
          label: 'LQIP modern avif @ 32px',
          description:
            '32px AVIF thumbnail generated by lqip-modern and blurred with 20px.'
        },
        {
          id: 'gip',
          label: 'gip (cssgip)',
          description:
            'Gradient Image Placeholders generated with cssgip as CSS gradients.'
        },
        {
          id: 'css-lqip',
          label: 'CSS-LQIP (2026)',
          description:
            'Compact numeric CSS-LQIP value rendered with modern CSS gradients.'
        },
        {
          id: 'blurhash-as-css-gradient',
          label: 'blurhash-as-css-gradient',
          description:
            'BlurHash rendered as CSS gradients via @unpic/placeholder.'
        },
        {
          id: 'blurhash-as-css',
          label: 'blurhash-as-css',
          description:
            'BlurHash rendered as CSS object output from blurhash-to-css.'
        }
      ]

      function average(values) {
        return values.reduce((acc, value) => acc + value, 0) / values.length
      }

      function formatSeconds(tuple) {
        const seconds = tuple[0] + tuple[1] / 1_000_000_000
        return `${seconds.toFixed(3)}s`
      }

      function percent(value, baseline) {
        if (!baseline) return 'n/a'
        return `${((value / baseline) * 100).toFixed(2)}%`
      }

      function escapeHtml(text) {
        return text
          .replaceAll('&', '&amp;')
          .replaceAll('<', '&lt;')
          .replaceAll('>', '&gt;')
      }

      function getResult(image, variantId) {
        return image.results.find((result) => result.variantName === variantId)
      }

      function renderHeader(dataset) {
        const headerRow = document.querySelector('#header-row')
        const descriptionRow = document.querySelector('#description-row')

        for (const variant of VARIANTS) {
          const variantResults = dataset
            .map((image) => getResult(image, variant.id))
            .filter(Boolean)

          const avgProcessingNs = average(
            variantResults.map(
              (result) => result.processTime[0] * 1_000_000_000 + result.processTime[1]
            )
          )
          const avgSizeBytes = average(
            variantResults.map((result) => result.sizes.originalBytes)
          )
          const avgBaselineBytes = average(
            dataset
              .map((image) => getResult(image, 'thumbnail'))
              .filter(Boolean)
              .map((result) => result.sizes.originalBytes)
          )

          const th = document.createElement('th')
          th.textContent = variant.label
          if (variant.selected) th.classList.add('selected')
          headerRow.appendChild(th)

          const td = document.createElement('td')
          if (variant.selected) td.classList.add('selected')
          td.innerHTML = `
            <div class="description">
              <p>${escapeHtml(variant.description)}</p>
              <p class="processing-time">
                <img alt="average processing time" src="./assets/processing-time.svg" width="20" />
                <span title="Average processing time">${(avgProcessingNs / 1_000_000_000).toFixed(3)}s</span>
                <span title="Average size"> | ø ${Math.round(avgSizeBytes)} B</span>
                <span title="Average size compared to thumbnail"> | ${percent(avgSizeBytes, avgBaselineBytes)}</span>
              </p>
            </div>
          `
          descriptionRow.appendChild(td)
        }
      }

      function renderImageCell(cell, image, result, thumbnailResult) {
        const wrapper = document.createElement('div')
        wrapper.className = 'preview-wrapper'
        wrapper.style.paddingBottom = `${(image.dimensions.height / image.dimensions.width) * 100}%`

        if (result.variantName.startsWith('lqip-modern-')) {
          wrapper.classList.add('preview-wrapper-lqip')
        }

        if (result.kind === 'image') {
          const img = document.createElement('img')
          img.className = 'preview'
          img.src = `processed/${result.name}`
          img.alt = result.name
          wrapper.appendChild(img)
        } else if (result.kind === 'css-lqip') {
          const preview = document.createElement('picture')
          preview.className = 'css-lqip-preview'
          preview.style.setProperty('--lqip', result.lqip)

          const img = document.createElement('img')
          img.src = `processed/${thumbnailResult.name}`
          img.alt = `${image.filename}-css-lqip`
          preview.appendChild(img)
          wrapper.appendChild(preview)
        } else {
          const preview = document.createElement('div')
          preview.className = 'css-preview'
          preview.setAttribute('style', result.css)
          wrapper.appendChild(preview)
        }

        const overlay = document.createElement('div')
        overlay.className = 'overlay'
        overlay.innerHTML = `
          <div>
            ${
              result.kind === 'image'
                ? `<a href="processed/${result.name}">${result.name}</a>`
                : `<code>${escapeHtml(
                    result.kind === 'css-lqip' ? result.lqip : result.css
                  )}</code>`
            }
          </div>
          <table>
            <tbody>
              <tr><th>Dimensions</th><td>${result.dimensions.width} x ${result.dimensions.height}</td></tr>
              <tr><th>Ratio</th><td>${result.dimensions.ratio}</td></tr>
              <tr><th>Original size</th><td>${result.sizes.originalHuman}</td></tr>
              <tr><th>Gzip size</th><td>${result.sizes.gzipHuman}</td></tr>
              <tr><th>Brotli size</th><td>${result.sizes.brotliHuman}</td></tr>
              <tr><th>Proc time</th><td>${formatSeconds(result.processTime)}</td></tr>
              <tr><th>Size vs thumbnail</th><td>${percent(
                result.sizes.originalBytes,
                thumbnailResult.sizes.originalBytes
              )}</td></tr>
            </tbody>
          </table>
        `
        wrapper.appendChild(overlay)
        cell.appendChild(wrapper)
      }

      function renderRows(dataset) {
        const tbody = document.querySelector('#rows')

        for (const image of dataset) {
          const row = document.createElement('tr')
          const thumbnailResult = getResult(image, 'thumbnail')
          if (!thumbnailResult) continue

          for (const variant of VARIANTS) {
            const result = getResult(image, variant.id)
            const cell = document.createElement('td')

            if (variant.selected) {
              cell.classList.add('selected')
            }

            if (!result) {
              cell.textContent = '-'
              row.appendChild(cell)
              continue
            }

            renderImageCell(cell, image, result, thumbnailResult)
            row.appendChild(cell)
          }

          tbody.appendChild(row)
        }
      }

      async function init() {
        const statusEl = document.querySelector('#status')
        const tableEl = document.querySelector('#comparison-table')

        try {
          const response = await fetch('./dataset.json')
          if (!response.ok) {
            throw new Error(`Failed to load dataset: ${response.status}`)
          }

          const dataset = await response.json()
          renderHeader(dataset)
          renderRows(dataset)
          statusEl.remove()
          tableEl.hidden = false
        } catch (error) {
          statusEl.className = 'error'
          statusEl.textContent = `Error loading comparison data: ${error.message}`
        }
      }

      init()
    </script>
  </body>
</html>
